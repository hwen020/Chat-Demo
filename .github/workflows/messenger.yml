name: Messenger CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: messenger
          POSTGRES_PASSWORD: messenger
          POSTGRES_DB: messenger
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U messenger -d messenger"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://messenger:messenger@127.0.0.1:55433/messenger
      PYTHONPATH: ${{ github.workspace }}/packages/shared/python
      COOKIE_SECURE: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/messenger/api/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/messenger/web/package-lock.json
      - run: pip install -r requirements-test.txt
        working-directory: apps/messenger/api
      - run: alembic upgrade head && python -m pytest -q --junitxml=../../../messenger-results.xml
        working-directory: apps/messenger/api
      - run: npm ci && npm run build
        working-directory: apps/messenger/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/messenger/web
      - run: |
          export APP_ORIGINS=http://127.0.0.1:8001
          export STATIC_DIR="$PWD/apps/messenger/web/dist"
          uvicorn app.main:app --app-dir apps/messenger/api --host 127.0.0.1 --port 8001 --no-access-log > messenger.log 2>&1 &
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:8001/readyz; then exit 0; fi
            sleep 1
          done
          cat messenger.log
          exit 1
      - run: npm test -- --reporter=list
        working-directory: apps/messenger/web
        env:
          MESSENGER_WEB: http://127.0.0.1:8001
      - run: docker compose config --quiet && docker compose build messenger
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: messenger-test-results
          path: |
            messenger-results.xml
            messenger.log
            apps/messenger/web/test-results
