name: AI Chat CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    # Playwright 1.52 supports Ubuntu 24.04.
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: chatflow
          POSTGRES_PASSWORD: chatflow
          POSTGRES_DB: chatflow
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U chatflow -d chatflow"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://chatflow:chatflow@127.0.0.1:55432/chatflow
      COOKIE_SECURE: "0"
      APP_ORIGINS: http://127.0.0.1:8000
      CHATFLOW_TEST_ORIGIN: http://127.0.0.1:8000
      CHATFLOW_WEB: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/ai-chat/api/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/ai-chat/web/package-lock.json
      - run: pip install -r apps/ai-chat/api/requirements-test.txt
      - run: npm ci
        working-directory: apps/ai-chat/web
      - run: npm run build
        working-directory: apps/ai-chat/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/ai-chat/web
      - run: alembic upgrade head
        working-directory: apps/ai-chat/api
      - run: |
          export STATIC_DIR="$PWD/apps/ai-chat/web/dist"
          uvicorn app.main:app --app-dir apps/ai-chat/api --host 127.0.0.1 --port 8000 --no-access-log > api.log 2>&1 &
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/readyz; then exit 0; fi
            sleep 1
          done
          cat api.log
          exit 1
      - run: python -m pytest -q --junitxml=../../../pytest-results.xml
        working-directory: apps/ai-chat/api
      - run: npm test -- --reporter=list,html
        working-directory: apps/ai-chat/web
      - run: docker compose config --quiet && docker compose build api
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-evidence
          path: |
            api.log
            pytest-results.xml
            apps/ai-chat/web/test-results
            apps/ai-chat/web/playwright-report
