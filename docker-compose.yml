name: chatflow
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: chatflow
      POSTGRES_PASSWORD: ${CHATFLOW_DB_PASSWORD:-chatflow}
      POSTGRES_DB: chatflow
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatflow -d chatflow"]
      interval: 3s
      timeout: 3s
      retries: 15
  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://chatflow:${CHATFLOW_DB_PASSWORD:-chatflow}@db:5432/chatflow
      APP_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
      COOKIE_SECURE: "0"
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --no-access-log"]
    ports:
      - "127.0.0.1:8080:8000"
volumes:
  database:
